<style>
  :root {
    --bg: {{color-bg}};
    --grad-start: {{color-gradient-start}};
    --grad-end: {{color-gradient-end}};
    --card: {{color-card}};
    --accent: {{color-accent}};
    --accent2: {{color-accent2}};
    --text: {{color-text}};
    --muted: {{color-muted}};
    --radius: {{radius}};
    --shadow: {{shadow}};
    --font: {{font}};
  }
  body {
    margin:0; padding:0; height:100%; width:100%;
    background: radial-gradient(circle at 20% 20%, #1e293b, var(--bg) 50%),
                linear-gradient(135deg, var(--grad-start) 0%, var(--grad-end) 100%);
    font-family: var(--font); color: var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 32px;
    max-width: 440px;
    width: 90%;
    backdrop-filter: blur(12px);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 30px 60px rgba(0,0,0,0.45); }
  .title {
    font-size: 22px; font-weight: 700; margin: 0 0 6px 0;
  }
  .subtitle {
    font-size: 13px; color: var(--muted); margin: 0 0 18px 0;
  }
  .field-label { font-size: 12px; color: var(--muted); margin: 12px 0 4px 0; display:block; }
  .field {
    width: 100%; padding: 12px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06); color: var(--text); font-size: 14px;
    box-sizing: border-box;
  }
  .field:focus { outline: 1px solid var(--accent2); }
  .options-row { display:flex; justify-content: space-between; align-items:center; margin-top: 10px; }
  .remember { display:flex; gap:8px; align-items:center; color: var(--muted); font-size: 13px; user-select: none; }
  .button-row {
    display:flex; gap:10px; margin-top: 16px;
  }
  .btn {
    flex:1; padding:12px 14px; border:none; border-radius:10px; cursor:pointer; font-weight:700;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color:#0b1727; transition: transform .2s ease, box-shadow .2s ease;
    box-shadow: 0 10px 25px rgba(34,197,94,0.25);
  }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .ghost {
    background: rgba(255,255,255,0.04); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: none;
  }
  .status { margin-top: 12px; font-size: 13px; min-height: 18px; }
</style>
<div class='card'>
  <div class='title'>Hoş Geldiniz</div>
  <div class='subtitle'>Hesabınıza giriş yapın</div>

  <label class='field-label' for='emailInput'>E-posta / TC No / Telefon</label>
  <input id='emailInput' class='field' type='text' placeholder='ornek@eposta.com' autocomplete='username' />

  <label class='field-label' for='passwordInput'>Şifre</label>
  <input id='passwordInput' class='field' type='password' placeholder='••••••••' autocomplete='current-password' />

  <div class='options-row'>
    <label class='remember'>
      <input id='rememberCheck' type='checkbox' />
      <span>Beni Hatırla</span>
    </label>
  </div>

  <div class='button-row'>
    <button id='forgotBtn' class='btn ghost'>Şifremi Unuttum</button>
    <button id='loginBtn' class='btn'>Giriş Yap</button>
  </div>

  <div id='statusText' class='status'></div>
</div>

<script>
  (function() {
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const rememberCheck = document.getElementById('rememberCheck');
    const statusText = document.getElementById('statusText');

    function post(action) {
      if (!(window.chrome && window.chrome.webview && window.chrome.webview.postMessage)) return;
      const payload = {
        action,
        email: emailInput.value || '',
        password: passwordInput.value || '',
        remember: !!rememberCheck.checked
      };
      window.chrome.webview.postMessage(JSON.stringify(payload));
    }

    document.getElementById('loginBtn')?.addEventListener('click', function() { post('login'); });
    document.getElementById('forgotBtn')?.addEventListener('click', function() { post('forgot'); });
    passwordInput?.addEventListener('keydown', function(e) { if (e.key === 'Enter') post('login'); });
    emailInput?.addEventListener('keydown', function(e) { if (e.key === 'Enter') post('login'); });

    // Expose status updater for host
    window.__ustadSetStatus = function (msg, isError) {
      if (!statusText) return;
      statusText.textContent = msg || '';
      statusText.style.color = isError ? '#ef4444' : '#10b981';
    };
  })();
</script>
